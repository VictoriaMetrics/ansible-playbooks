---
- name: Create VictoriaTraces system group
  ansible.builtin.group:
    name: "{{ vtsingle_system_group }}"
    state: present
    system: true
  when: vtsingle_system_group != "root"

- name: Create VictoriaTraces system user
  ansible.builtin.user:
    name: "{{ vtsingle_system_user }}"
    groups: "{{ vtsingle_system_group }}"
    append: true
    shell: /usr/sbin/nologin
    system: true
    createhome: false
  when: vtsingle_system_user != "root"

- name: Ensure existence of bin directory
  ansible.builtin.file:
    path: "{{ vtsingle_bin_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure existence of VictoriaTraces storage directory
  ansible.builtin.file:
    path: "{{ vtsingle_data_dir }}"
    state: directory
    mode: "0755"
    owner: "{{ vtsingle_system_user }}"
    group: "{{ vtsingle_system_group }}"

- name: Install via control host
  when: vtsingle_install_download_to_control
  block:
    - name: Prepare local download paths
      delegate_to: localhost
      become: no
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /tmp/vt-single/
      when:
        - not ansible_check_mode
        - not vtsingle_is_installed.stat.exists or
          vtsingle_version not in vtsingle_current_version.stdout

    - name: Download and unarchive VictoriaTraces release binary
      environment:
        http_proxy: "{{ vm_proxy_http }}"
        https_proxy: "{{ vm_proxy_https }}"
      ansible.builtin.unarchive:
        src: "{{ vtsingle_download_url }}"
        dest: /tmp/vt-single/
        remote_src: yes
        extra_opts:
          - --no-same-owner
      notify: Restart VictoriaTraces service
      register: archive_downloaded
      become: no
      delegate_to: localhost
      when:
        - not ansible_check_mode
        - not vtsingle_is_installed.stat.exists or
          vtsingle_version not in vtsingle_current_version.stdout

    - name: Upload VictoriaTraces release binary # noqa: no-handler
      ansible.builtin.copy:
        src: /tmp/vt-single/victoria-traces-prod
        dest: "{{ vtsingle_bin_dir }}/victoria-traces-prod"
        mode: "0751"
        owner: root
        group: "{{ vtsingle_system_group }}"
      when:
        - archive_downloaded is changed

  always:
    - name: Clear download paths
      delegate_to: localhost
      become: no
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/vt-single/
      when:
        - not ansible_check_mode

- name: Install directly to target host
  when: not vtsingle_install_download_to_control
  block:
    - name: Download and unarchive VictoriaTraces release binary
      environment:
        http_proxy: "{{ vm_proxy_http }}"
        https_proxy: "{{ vm_proxy_https }}"
      ansible.builtin.unarchive:
        src: "{{ vtsingle_download_url }}"
        dest: /tmp
        remote_src: yes
        extra_opts:
          - --no-same-owner
      when:
        - not ansible_check_mode
        - not vtsingle_is_installed.stat.exists or
          vtsingle_version not in vtsingle_current_version.stdout

    - name: Replace VictoriaTraces binary at target dir
      notify: Restart VictoriaTraces service
      ansible.builtin.copy:
        src: /tmp/victoria-traces-prod
        dest: "{{ vtsingle_bin_dir }}/victoria-traces-prod"
        mode: "0751"
        owner: root
        group: "{{ vtsingle_system_group }}"
        remote_src: true
      when:
        - not ansible_check_mode
        - not vtsingle_is_installed.stat.exists or
          vtsingle_version not in vtsingle_current_version.stdout

  always:
    - name: Clear download paths
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/victoria-traces-prod
      when:
        - not ansible_check_mode

- name: Restore SELinux context for VictoriaTraces binary
  ansible.builtin.command:
    argv:
      - restorecon
      - -v
      - "{{ vtsingle_bin_dir }}/victoria-traces-prod"
  register: restorecon_result
  changed_when: "'relabeled' in restorecon_result.stdout"
  when:
    - ansible_facts['selinux'] is defined
    - ansible_facts['selinux'].status == "enabled"
    - not ansible_check_mode
