---
- name: Configure env
  when: vtsingle_service_envflag_enabled | bool
  block:
    - name: Validate envflag data
      vars:
        envflag_entry_pattern: '^[A-Za-z_][A-Za-z0-9_]*=[^"\n]*\Z'
        envflag_invalid_entries: "{{ vtsingle_service_envflag_data | map('string') | reject('match', envflag_entry_pattern) | list }}"
      ansible.builtin.assert:
        that:
          - envflag_invalid_entries | length == 0
        fail_msg: >-
          vtsingle_service_envflag_data entries must be single-line KEY=value strings
          containing no double quote. A newline in an entry closes the Environment=
          line and injects the rest as systemd directives, which can override User=.
          Invalid entries: {{ envflag_invalid_entries }}

    - name: Check envfile presence
      ansible.builtin.stat:
        path: "{{ vtsingle_service_envflag_file }}"
      register: envfile_state

    - name: Setup envfile
      ansible.builtin.file:
        state: touch
        path: "{{ vtsingle_service_envflag_file }}"
        owner: root
        group: root
        mode: "0644"
        access_time: preserve
      notify: Restart VictoriaTraces service
      when: envfile_state.stat.exists is defined and not envfile_state.stat.exists

- name: Copy VictoriaTraces systemd unit file
  ansible.builtin.template:
    src: victoriatraces.service.j2
    dest: "/etc/systemd/system/{{ vtsingle_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  register: config_template
  no_log: True

- name: Daemon-reload VictoriaTraces service
  become: true
  notify: Restart VictoriaTraces service
  ansible.builtin.systemd:
    daemon_reload: true
    name: "{{ vtsingle_service_name }}"
  when: config_template is changed  # noqa: no-handler
  changed_when: config_template is changed

- name: Ensure VictoriaTraces service is enabled on boot
  become: true
  ansible.builtin.systemd:
    name: "{{ vtsingle_service_name }}"
    enabled: true
    state: started
