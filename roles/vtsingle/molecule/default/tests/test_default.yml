service:
  "victoriatraces":
    enabled: true
    running: true

port:
  tcp:10428:
    listening: true

file:
  /etc/systemd/system/victoriatraces.service:
    exists: true
    contains:
      - "/^Description=VictoriaTraces service$/"
      - "ProtectControlGroups=true"
      - "ProtectKernelModules=true"
      - "ProtectKernelTunables=yes"
      - "/^EnvironmentFile=\\/etc\\/default\\/victoriatraces\\.env$/"
  /etc/default/victoriatraces.env:
    exists: true
    mode: "0600"
    owner: root
    group: root
    contains:
      - "/^http_pathPrefix='\\/vtsingle'$/"

# -http.pathPrefix is supplied only through the role-managed env file, so a 200
# on the prefixed path proves the envflag block rendered and the value reached
# the binary.
http:
  "http://127.0.0.1:10428/vtsingle/metrics":
    status: 200
