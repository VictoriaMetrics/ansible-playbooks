---
- name: Converge
  hosts: all
  become: yes
  vars:
    vtsingle_data_dir: "/tmp/victoria-traces/"
    # Envflag enabled here so the Configure env block in tasks/configure.yml
    # executes somewhere in CI. -http.pathPrefix is only ever supplied through
    # the env file, so the http check in test_default.yml proves it took effect.
    vtsingle_service_envflag_enabled: true
    vtsingle_service_envflag_data:
      - "http_pathPrefix=/vtsingle"
    # Deprecated alias set on purpose to prove backward-compatible resolution.
    victoriatraces_retention_period_months: "6"
  tasks:
    - name: "Include vtsingle"
      ansible.builtin.include_role:
        name: "vtsingle"
        public: true

    - name: "Assert deprecated alias resolves into service args"
      ansible.builtin.assert:
        that:
          - vtsingle_service_args['retentionPeriod'] == '6'
        fail_msg: >-
          Deprecated alias victoriatraces_retention_period_months did not resolve
          into vtsingle_service_args
