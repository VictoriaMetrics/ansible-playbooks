---
- name: Setup runtime service parameters
  ansible.builtin.set_fact:
    _runtime_vmstorage_service_args: "{{ vmstorage_service_args | default({}, true) }}"
    _runtime_vmstorage_service_envflag_data: "{{ vmstorage_service_envflag_data | default({}, true) }}"

- name: Assert envflag data is unset when envflag support is disabled
  ansible.builtin.assert:
    that: _runtime_vmstorage_service_envflag_data | length == 0
    msg: >-
      vmstorage_service_envflag_enabled is disabled, so vmstorage_service_envflag_data
      is not passed to vmstorage. Move these parameters to vmstorage_service_args or
      enable envflag support.
  when: not vmstorage_service_envflag_enabled | bool

- name: Validate envflag data
  vars:
    envflag_key_pattern: '^[A-Za-z_][A-Za-z0-9_]*\Z'
    envflag_value_pattern: '^[^''\n]*\Z'
    envflag_invalid_keys: >-
      {{ _runtime_vmstorage_service_envflag_data.keys() | map('string')
         | reject('match', envflag_key_pattern) | join(', ') }}
    envflag_invalid_value_keys: >-
      {{ _runtime_vmstorage_service_envflag_data.keys()
         | zip(_runtime_vmstorage_service_envflag_data.values() | map('string'))
         | rejectattr('1', 'match', envflag_value_pattern)
         | map(attribute='0') | join(', ') }}
  ansible.builtin.assert:
    that:
    - _runtime_vmstorage_service_envflag_data.keys() | map('string') | reject('match', envflag_key_pattern) | list | length == 0
    - _runtime_vmstorage_service_envflag_data.values() | map('string') | reject('match', envflag_value_pattern) | list | length == 0
    fail_msg: >-
      vmstorage_service_envflag_data keys must match [A-Za-z_][A-Za-z0-9_]* and values must be
      single-line and contain no single quote. Each '.' in a flag name must be replaced
      with '_'. The role renders every entry into vmstorage_service_envflag_data_file as
      KEY='value', and systemd recognizes no escape sequences inside single quotes, so a
      single quote in a value terminates it early. systemd also drops an EnvironmentFile
      assignment whose name it rejects, logging "Ignoring invalid environment assignment"
      and starting the service anyway, so an invalid key is never applied. Values are not
      reported because they can hold secrets.
      Invalid keys: [{{ envflag_invalid_keys }}].
      Keys with invalid values: [{{ envflag_invalid_value_keys }}].
  when: vmstorage_service_envflag_enabled | bool

- name: Validate envflag file paths
  ansible.builtin.assert:
    that:
    - vmstorage_service_envflag_data_file != vmstorage_service_envflag_file
    fail_msg: >-
      vmstorage_service_envflag_data_file and vmstorage_service_envflag_file must be
      different paths, but both resolve to {{ vmstorage_service_envflag_data_file }}.
      The role rewrites vmstorage_service_envflag_data_file on every run, so a shared
      path discards whatever you keep in vmstorage_service_envflag_file - including
      secrets - and collapses the override the two-file layout provides.
  when: vmstorage_service_envflag_enabled | bool

- name: Assert usage of systemd as an init system
  ansible.builtin.assert:
    that: ansible_facts['service_mgr'] == 'systemd'
    msg: "This role only works with systemd"

- name: Get systemd version
  ansible.builtin.command: systemctl --version
  changed_when: false
  check_mode: false
  register: __systemd_version

- name: Set systemd version fact
  ansible.builtin.set_fact:
    vmstorage_systemd_version: "{{ __systemd_version.stdout_lines[0].split(' ')[1] }}"

- name: Check if vmstorage is installed
  ansible.builtin.stat:
    path: "{{ vmstorage_bin_dir }}/vmstorage-prod"
  changed_when: false
  check_mode: false
  register: vmstorage_is_installed

- name: Check current vmstorage version
  ansible.builtin.command:
    argv:
    - "{{ vmstorage_bin_dir }}/vmstorage-prod"
    - --version
  changed_when: false
  failed_when: false
  check_mode: false
  register: vmstorage_current_version
  when: vmstorage_is_installed.stat.exists | bool

- name: Get latest VMstorage version via GitHub redirect
  ansible.builtin.uri:
    url: "{{ vmstorage_repo_url }}/releases/latest"
    method: HEAD
    return_content: false
    follow_redirects: false
    status_code: 302,200
  register: gh_redirect
  when: vmstorage_version == "latest"

- name: Extract version from Location header
  ansible.builtin.set_fact:
    vmstorage_version: "{{ (gh_redirect.location | regex_search('/releases/tag/(v[0-9].*)', '\\1'))[0] }}"
  when: vmstorage_version == "latest"
