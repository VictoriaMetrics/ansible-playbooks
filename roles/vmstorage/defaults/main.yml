---
vmstorage_version: "v1.151.0"
vmstorage_enterprise: false
vmstorage_license_key: ""
vmstorage_license_key_file: ""
vmstorage_service_name: "vmstorage"

vmstorage_repo_url: "https://github.com/VictoriaMetrics/VictoriaMetrics"
vmstorage_platform: "{% if vmstorage_version.replace('v', '') is version('1.79.0', '>=') %}-linux{% endif %}"
vmstorage_download_url: "{{ vmstorage_repo_url }}/releases/download/{{ vmstorage_version }}/victoria-metrics{{ vmstorage_platform }}-{{ go_arch }}-{{ vmstorage_version }}{%if vmstorage_enterprise %}-enterprise{% endif %}-cluster.tar.gz"

vmstorage_system_user: "victoriametrics"
vmstorage_system_group: "{{ vmstorage_system_user }}"

vmstorage_service_state: started
vmstorage_service_enabled: true
vmstorage_service_args: {}
vmstorage_exec_start_post: ""
vmstorage_exec_stop: ""

vmstorage_config_dir: "/opt/victoriametrics-vmstorage"
vmstorage_data_dir: "/var/lib/vmstorage"
vmstorage_bin_dir: /usr/local/bin
# Passed verbatim to -retentionPeriod. With no unit suffix the value is counted
# in months; see the docs for the supported unit suffixes.
# https://docs.victoriametrics.com/#retention
vmstorage_retention_period: 1

# more on envflags usage
# https://docs.victoriametrics.com/victoriametrics/single-server-victoriametrics/#environment-variables
vmstorage_service_envflag_enabled: true
# Role-managed env file holding vmstorage_service_envflag_data. Rewritten on every run.
vmstorage_service_envflag_data_file: "{{ vmstorage_config_dir }}/vmstorage.conf"
# User-managed env file, read after the role-managed one so its keys win.
# The role creates it empty and never rewrites its contents.
vmstorage_service_envflag_file: "/etc/default/{{ vmstorage_service_name }}"
_vmstorage_service_envflag_data_default:
  retentionPeriod: "{{ vmstorage_retention_period }}"
  storageDataPath: "{{ vmstorage_data_dir }}"
vmstorage_service_envflag_data: "{{ vmstorage_config | default(_vmstorage_service_envflag_data_default) }}"

vmstorage_install_download_to_control: false

vm_proxy_http: ""
vm_proxy_https: ""

# See https://www.freedesktop.org/software/systemd/man/systemd.exec.html#ProtectHome=
# Available options: 'yes', 'read-only', 'tmpfs'
vmstorage_systemd_protect_home: "yes"
