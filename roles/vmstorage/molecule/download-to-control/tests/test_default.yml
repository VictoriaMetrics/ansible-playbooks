service:
  "vmstorage":
    enabled: true
    running: true

port:
  tcp:8482:
    listening: true
  tcp:8400:
    listening: true
  tcp:8401:
    listening: true

# envflag is off here, which makes this scenario the disabled-path regression
# guard: no envflag artefacts in the unit, every flag on ExecStart.
file:
  /etc/systemd/system/vmstorage.service:
    exists: true
    contains:
      - "/^ExecStart=\\S*vmstorage-prod --/"
      - "!/-envflag\\.enable/"
      - "!/^EnvironmentFile=/"
      - "--storageDataPath=/var/lib/vmstorage"
  /etc/default/vmstorage:
    exists: false
