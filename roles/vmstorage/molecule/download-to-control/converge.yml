---
- name: Converge
  hosts: all
  become: yes
  vars:
    vmstorage_install_download_to_control: true
    # envflag off makes this scenario the disabled-path regression guard; the
    # default scenario covers the enabled path.
    vmstorage_service_envflag_enabled: false
    vmstorage_service_envflag_data: {}
    vmstorage_service_args:
      retentionPeriod: 1
      storageDataPath: /var/lib/vmstorage
  tasks:
    - name: "Include vmstorage"
      ansible.builtin.include_role:
        name: "vmstorage"
