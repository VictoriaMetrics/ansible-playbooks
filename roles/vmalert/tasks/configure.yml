---
- name: Configure env
  when: vmalert_service_envflag_enabled | bool
  block:
    - name: Validate envflag data
      vars:
        envflag_entry_pattern: '^[A-Za-z_][A-Za-z0-9_]*=[^''\n]*\Z'
        envflag_invalid_positions: >-
          {{ vmalert_service_envflag_data | map('string')
             | zip(range(1, vmalert_service_envflag_data | length + 1))
             | rejectattr('0', 'match', envflag_entry_pattern)
             | map(attribute='1') | join(', ') }}
      ansible.builtin.assert:
        that:
          - vmalert_service_envflag_data | map('string') | reject('match', envflag_entry_pattern) | list | length == 0
        fail_msg: >-
          vmalert_service_envflag_data entries must be single-line KEY=value strings whose
          key matches [A-Za-z_][A-Za-z0-9_]* and whose value contains no single quote.
          Each '.' in a flag name must be replaced with '_'. The role renders every entry
          into vmalert_service_envflag_data_file as KEY='value', and systemd recognizes no
          escape sequences inside single quotes, so a single quote in a value terminates it
          early. systemd also drops an assignment whose name it rejects, logging "Ignoring
          invalid environment assignment" and starting the service anyway, so an invalid key
          would never be applied. Entry values are not reported because they can hold
          secrets - invalid entries are at 1-based positions: {{ envflag_invalid_positions }}

    - name: Validate envflag file paths
      ansible.builtin.assert:
        that:
          - vmalert_service_envflag_data_file != vmalert_service_envflag_file
        fail_msg: >-
          vmalert_service_envflag_data_file and vmalert_service_envflag_file must be
          different paths, but both resolve to {{ vmalert_service_envflag_data_file }}.
          The role rewrites vmalert_service_envflag_data_file on every run, so a shared
          path discards whatever you keep in vmalert_service_envflag_file - including
          secrets - and collapses the override the two-file layout provides.

    - name: Configure envflag data file
      ansible.builtin.template:
        src: envflag.env.j2
        dest: "{{ vmalert_service_envflag_data_file }}"
        owner: root
        group: root
        mode: "0600"
      no_log: true
      notify: Restart VMalert service

    - name: Setup envfile
      ansible.builtin.file:
        state: touch
        path: "{{ vmalert_service_envflag_file }}"
        owner: root
        group: root
        mode: "0600"
        access_time: preserve
        modification_time: preserve
      notify: Restart VMalert service

- name: Copy VMalert systemd unit file
  ansible.builtin.template:
    src: systemd-service.j2
    dest: "/etc/systemd/system/{{ vmalert_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  register: config_template
  notify: Restart VMalert service
  no_log: True

- name: Daemon-reload VMalert service # noqa: no-handler
  become: true
  ansible.builtin.systemd:
    daemon_reload: true
  when: config_template is changed
  changed_when: config_template is changed

- name: Ensure VMalert service is enabled on boot
  become: true
  ansible.builtin.systemd:
    name: "{{ vmalert_service_name }}"
    enabled: true
  ignore_errors: '{{ ansible_check_mode }}'

- name: Prepare configuration dir
  ansible.builtin.file:
    state: directory
    path: "{{ vmalert_config_dir }}"
    mode: "0751"
    owner: "{{ vmalert_system_user }}"
    group: "{{ vmalert_system_group }}"

- name: Configure alerts config
  ansible.builtin.template:
    src: alerts.yml.j2
    dest: "{{ vmalert_rules_config_path }}"
    mode: "0600"
    owner: "{{ vmalert_system_user }}"
    group: "{{ vmalert_system_group }}"
    validate: "{{ vmalert_bin_dir }}/vmalert-prod {% for k, v in vmalert_service_args.items() %}{% if k.startswith('license') %} -{{ k }}={{ v | quote }} {% endif %}{% endfor %} -dryRun -rule %s"
    backup: yes
  no_log: true
  notify: Restart VMalert service
  when: vmalert_default_rules_enabled | bool
