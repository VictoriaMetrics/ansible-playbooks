---
- name: Configure env
  when: vmalert_service_envflag_enabled | bool
  block:
    - name: Validate envflag data
      vars:
        envflag_entry_pattern: '^[A-Za-z_][A-Za-z0-9_]*=[^"\n]*\Z'
        envflag_invalid_entries: "{{ vmalert_service_envflag_data | map('string') | reject('match', envflag_entry_pattern) | list }}"
      ansible.builtin.assert:
        that:
          - envflag_invalid_entries | length == 0
        fail_msg: >-
          vmalert_service_envflag_data entries must be single-line KEY=value strings
          containing no double quote. A newline in an entry closes the Environment=
          line and injects the rest as systemd directives, which can override User=.
          Invalid entries: {{ envflag_invalid_entries }}

    - name: Check envfile presence
      ansible.builtin.stat:
        path: "{{ vmalert_service_envflag_file }}"
      register: envfile_state

    - name: Setup envfile
      ansible.builtin.file:
        state: touch
        path: "{{ vmalert_service_envflag_file }}"
        owner: root
        group: root
        mode: "0644"
        access_time: preserve
      notify: Restart VMalert service
      when: envfile_state.stat.exists is defined and not envfile_state.stat.exists

- name: Copy VMalert systemd unit file
  ansible.builtin.template:
    src: systemd-service.j2
    dest: "/etc/systemd/system/{{ vmalert_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  register: config_template
  notify: Restart VMalert service
  no_log: True

- name: Daemon-reload VMalert service # noqa: no-handler
  become: true
  ansible.builtin.systemd:
    daemon_reload: true
  when: config_template is changed
  changed_when: config_template is changed

- name: Ensure VMalert service is enabled on boot
  become: true
  ansible.builtin.systemd:
    name: "{{ vmalert_service_name }}"
    enabled: true
  ignore_errors: '{{ ansible_check_mode }}'

- name: Prepare configuration dir
  ansible.builtin.file:
    state: directory
    path: "{{ vmalert_config_dir }}"
    mode: "0751"
    owner: "{{ vmalert_system_user }}"
    group: "{{ vmalert_system_group }}"

- name: Configure alerts config
  ansible.builtin.template:
    src: alerts.yml.j2
    dest: "{{ vmalert_rules_config_path }}"
    mode: "0600"
    owner: "{{ vmalert_system_user }}"
    group: "{{ vmalert_system_group }}"
    validate: "{{ vmalert_bin_dir }}/vmalert-prod {% for k, v in vmalert_service_args.items() %}{% if k.startswith('license') %} -{{ k }}={{ v | quote }} {% endif %}{% endfor %} -dryRun -rule %s"
    backup: yes
  no_log: true
  notify: Restart VMalert service
  when: vmalert_default_rules_enabled | bool
