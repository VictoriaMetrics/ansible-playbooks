service:
  "vic-vmalert":
    enabled: true
    running: true

port:
  tcp:9431:
    listening: true

file:
  /etc/systemd/system/vic-vmalert.service:
    exists: true
    contains:
      - "/^Description=VictoriaMetrics VMalert service$/"
      - "ProtectControlGroups=true"
      - "ProtectKernelModules=true"
      - "ProtectKernelTunables=yes"
      - "/^ExecStart=\\S*vmalert-prod -envflag\\.enable --/"
      # Role-managed file first, user-managed second: systemd reads EnvironmentFile
      # in listed order and the later one wins, so user keys override the role's.
      - "/^EnvironmentFile=\\/etc\\/default\\/vic-vmalert\\.env$/"
      - "/^EnvironmentFile=\\/etc\\/default\\/vic-vmalert$/"
  /etc/default/vic-vmalert.env:
    exists: true
    mode: "0600"
    owner: root
    group: root
    contains:
      - "/^http_pathPrefix='\\/vmalert'$/"
  /etc/default/vic-vmalert:
    exists: true
    mode: "0600"
    owner: root
    group: root

# Proves the environment variable reached the binary: -http.pathPrefix is only
# ever supplied through the env file, so a 200 here means envflag took effect.
http:
  "http://127.0.0.1:9431/vmalert/health":
    status: 200
