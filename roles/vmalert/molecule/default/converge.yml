---
- name: Converge
  hosts: all
  become: yes
  vars:
    # Deprecated alias set on purpose to prove backward-compatible resolution.
    vic_vm_alert_evaluation_interval: "45s"
    # String form on purpose - the vmagent and vlagent converges cover the
    # boolean form, so this one exercises the string form the README uses.
    vmalert_service_envflag_enabled: "true"
    vmalert_service_envflag_data:
      - "http_pathPrefix=/vmalert"
  tasks:
    - name: "Include vmalert"
      ansible.builtin.include_role:
        name: "vmalert"
        public: true

    - name: "Assert deprecated alias resolves into service args"
      ansible.builtin.assert:
        that:
          - vmalert_service_args['evaluationInterval'] == '45s'
        fail_msg: >-
          Deprecated alias vic_vm_alert_evaluation_interval did not resolve into
          vmalert_service_args
