---
- name: Configure env
  when: vlagent_service_envflag_enabled | bool
  block:
    - name: Validate envflag data
      vars:
        envflag_entry_pattern: '^[A-Za-z_][A-Za-z0-9_]*=[^''\n]*\Z'
        envflag_invalid_positions: >-
          {{ vlagent_service_envflag_data | map('string')
             | zip(range(1, vlagent_service_envflag_data | length + 1))
             | rejectattr('0', 'match', envflag_entry_pattern)
             | map(attribute='1') | join(', ') }}
      ansible.builtin.assert:
        that:
          - vlagent_service_envflag_data | map('string') | reject('match', envflag_entry_pattern) | list | length == 0
        fail_msg: >-
          vlagent_service_envflag_data entries must be single-line KEY=value strings whose
          key matches [A-Za-z_][A-Za-z0-9_]* and whose value contains no single quote.
          Each '.' in a flag name must be replaced with '_'. The role renders every entry
          into vlagent_service_envflag_data_file as KEY='value', and systemd recognizes no
          escape sequences inside single quotes, so a single quote in a value terminates it
          early. systemd also drops an assignment whose name it rejects, logging "Ignoring
          invalid environment assignment" and starting the service anyway, so an invalid key
          would never be applied. Entry values are not reported because they can hold
          secrets - invalid entries are at 1-based positions: {{ envflag_invalid_positions }}

    - name: Configure envflag data file
      ansible.builtin.template:
        src: envflag.env.j2
        dest: "{{ vlagent_service_envflag_data_file }}"
        owner: root
        group: root
        mode: "0600"
      no_log: true
      notify: Restart VLagent service

    - name: Check envfile presence
      ansible.builtin.stat:
        path: "{{ vlagent_service_envflag_file }}"
      register: envfile_state

    - name: Setup envfile
      ansible.builtin.file:
        state: touch
        path: "{{ vlagent_service_envflag_file }}"
        owner: root
        group: root
        mode: "0600"
        access_time: preserve
      notify: Restart VLagent service
      when: envfile_state.stat.exists is defined and not envfile_state.stat.exists

- name: Copy VLagent systemd unit file
  ansible.builtin.template:
    src: vlagent.service.j2
    dest: "/etc/systemd/system/{{ vlagent_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  register: config_template
  no_log: True
  notify: Restart VLagent service

- name: Daemon-reload VLagent service # noqa: no-handler
  become: true
  ansible.builtin.systemd:
    daemon_reload: true
  when: config_template is changed
  changed_when: config_template is changed

- name: Ensure VLagent service is enabled on boot
  become: true
  ansible.builtin.systemd:
    name: "{{ vlagent_service_name }}"
    enabled: true
