---
- name: Create VLagent system group
  ansible.builtin.group:
    name: "{{ vlagent_system_group }}"
    state: present
    system: true
  when: vlagent_system_group != "root"

- name: Create VLagent system user
  ansible.builtin.user:
    name: "{{ vlagent_system_user }}"
    groups: "{{ vlagent_system_group }}"
    append: true
    shell: /usr/sbin/nologin
    system: true
    createhome: false
  when: vlagent_system_user != "root"

- name: Ensure existence of bin directory
  ansible.builtin.file:
    path: "{{ vlagent_bin_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install via control host
  when: vlagent_install_download_to_control
  block:
  - name: Download and unarchive VLagent release binary
    environment:
      http_proxy: "{{ vm_proxy_http }}"
      https_proxy: "{{ vm_proxy_https }}"
    ansible.builtin.unarchive:
      src: "{{ vlagent_download_url }}"
      dest: /tmp
      remote_src: yes
    delegate_to: localhost
    become: no
    when:
    - not ansible_check_mode
    - not vlagent_is_installed.stat.exists or
      vlagent_version not in vlagent_current_version.stdout

  - name: Copy vlagent binary to target host
    notify: Restart VLagent service
    ansible.builtin.copy:
      src: /tmp/vlagent-prod
      dest: "{{ vlagent_bin_dir }}/vlagent-prod"
      mode: "0751"
      owner: root
      group: "{{ vlagent_system_group }}"
    when:
    - not ansible_check_mode
    - not vlagent_is_installed.stat.exists or
      vlagent_version not in vlagent_current_version.stdout

  always:
  - name: Clear download file
    become: no
    delegate_to: localhost
    ansible.builtin.file:
      path: "/tmp/vlagent-prod"
      state: absent
    when:
    - not ansible_check_mode

- name: Install directly to target host
  when: not vlagent_install_download_to_control
  block:
  - name: Download and unarchive VLagent release binary
    environment:
      http_proxy: "{{ vm_proxy_http }}"
      https_proxy: "{{ vm_proxy_https }}"
    ansible.builtin.unarchive:
      src: "{{ vlagent_download_url }}"
      dest: /tmp
      remote_src: yes
      extra_opts:
      - --no-same-owner
    when:
    - not ansible_check_mode
    - not vlagent_is_installed.stat.exists or
      vlagent_version not in vlagent_current_version.stdout

  - name: Replace vlagent binary at target dir
    notify: Restart VLagent service
    ansible.builtin.copy:
      src: /tmp/vlagent-prod
      dest: "{{ vlagent_bin_dir }}/vlagent-prod"
      mode: "0751"
      owner: root
      group: "{{ vlagent_system_group }}"
      remote_src: true
    when:
    - not ansible_check_mode
    - not vlagent_is_installed.stat.exists or
      vlagent_version not in vlagent_current_version.stdout

  always:
  - name: Clear download file
    ansible.builtin.file:
      path: "/tmp/vlagent-prod"
      state: absent
    when:
    - not ansible_check_mode
