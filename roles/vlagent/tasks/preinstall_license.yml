# Enterprise flags go to _vlagent_enterprise_args, which the templates merge into
# vlagent_service_args. set_fact on vlagent_service_args itself would be shadowed when users
# pass it as include_role vars or extra vars.
- name: Check whether the release accepts -eula instead of a license key
  ansible.builtin.set_fact:
    _vlagent_enterprise_args: {}
    _vlagent_use_eula: >-
      {{ (vlagent_enterprise | bool) and (_version == 'latest'
        or _version is version('1.54.0', '>=')
        or (_version is version('1.52.2', '>=') and _version is version('1.53.0', '<'))) }}
  vars:
    # -eula replaced license keys in v1.54.0 and v1.52.2:
    # https://docs.victoriametrics.com/victorialogs/changelog/#v1540
    # "latest" is resolved to a tag later in preinstall.yml; the latest release
    # already uses -eula, so it is not compared here.
    _version: "{{ vlagent_version | regex_replace('^v', '') }}"

- name: Accept the Enterprise EULA
  when:
    - vlagent_enterprise | bool
    - _vlagent_use_eula | bool
  block:
    - name: Ensure the Enterprise Software Agreement is accepted
      ansible.builtin.assert:
        that: vlagent_accept_eula | bool
        msg: >-
          vlagent {{ vlagent_version }} Enterprise runs only with the Enterprise Software Agreement
          (https://victoriametrics.com/legal/esa/) accepted. Set vlagent_accept_eula (or vm_enterprise_accept_eula for all roles)
          to true to accept it.

    - name: Add eula parameter to service config
      ansible.builtin.set_fact:
        _vlagent_enterprise_args:
          eula: "true"

    - name: Report ignored license variables
      ansible.builtin.debug:
        msg: >-
          vlagent {{ vlagent_version }} does not verify license keys and runs with -eula,
          so vlagent_license_key and vlagent_license_key_file are ignored.
      when: vlagent_license_key != "" or vlagent_license_key_file != ""

- name: Pass the license key
  when:
    - vlagent_enterprise | bool
    - not (_vlagent_use_eula | bool)
  block:
    - name: Ensure license key is provided
      ansible.builtin.assert:
        that: vlagent_license_key != "" or vlagent_license_key_file != ""
        msg: Either license key or license key file location must be provided.

    - name: Ensure only one of key or file is provided
      ansible.builtin.assert:
        that: vlagent_license_key == "" or vlagent_license_key_file == ""
        msg: Only one of license key or license key file must be provided.

    - name: Add license key parameter to service config
      ansible.builtin.set_fact:
        _vlagent_enterprise_args:
          license: "{{ vlagent_license_key }}"
      when: vlagent_license_key != ""

    - name: Add license key file parameter to service config
      ansible.builtin.set_fact:
        _vlagent_enterprise_args:
          licenseFile: "{{ vlagent_license_key_file }}"
      when: vlagent_license_key_file != ""
