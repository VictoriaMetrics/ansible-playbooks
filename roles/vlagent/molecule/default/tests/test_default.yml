service:
  "vic-vlagent":
    enabled: true
    running: true

port:
  tcp:9429:
    listening: true

file:
  /etc/systemd/system/vic-vlagent.service:
    exists: true
    contains:
      - "ProtectControlGroups=true"
      - "ProtectKernelModules=true"
      - "ProtectKernelTunables=yes"
  /tmp/vlagent:
    exists: true
    filetype: directory
    owner: vic_vl_agent
    group: vic_vl_agent
    mode: "0751"
