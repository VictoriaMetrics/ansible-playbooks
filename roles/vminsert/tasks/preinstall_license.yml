- name: Ensure license key is provided
  ansible.builtin.assert:
    that: vminsert_license_key != "" or vminsert_license_key_file != ""
    msg: Either license key or license key file location must be provided.
  when: vminsert_enterprise | bool

- name: Ensure only one of key or file is provided
  ansible.builtin.assert:
    that: vminsert_license_key_file == ""
    msg: Only one of license key or license key file must be provided.
  when:
    - vminsert_enterprise | bool
    - vminsert_license_key != ""

- name: Ensure only one of key or file is provided
  ansible.builtin.assert:
    that: vminsert_license_key == ""
    msg: Only one of license key or license key file must be provided.
  when:
    - vminsert_enterprise | bool
    - vminsert_license_key_file != ""


- name: Add license key parameter to envflag data
  ansible.builtin.set_fact:
    vminsert_service_envflag_data: "{{ vminsert_service_envflag_data | combine({'license': vminsert_license_key}) }}"
  when:
    - vminsert_enterprise | bool
    - vminsert_license_key != ""
    - vminsert_service_envflag_enabled | bool


- name: Add license key parameter to service args
  ansible.builtin.set_fact:
    vminsert_service_args: "{{ vminsert_service_args | combine({'license': vminsert_license_key}) }}"
  when:
    - vminsert_enterprise | bool
    - vminsert_license_key != ""
    - not vminsert_service_envflag_enabled | bool


- name: Add license key file parameter to envflag data
  ansible.builtin.set_fact:
    vminsert_service_envflag_data: "{{ vminsert_service_envflag_data | combine({'licenseFile': vminsert_license_key_file}) }}"
  when:
    - vminsert_enterprise | bool
    - vminsert_license_key_file != ""
    - vminsert_service_envflag_enabled | bool


- name: Add license key file parameter to service args
  ansible.builtin.set_fact:
    vminsert_service_args: "{{ vminsert_service_args | combine({'licenseFile': vminsert_license_key_file}) }}"
  when:
    - vminsert_enterprise | bool
    - vminsert_license_key_file != ""
    - not vminsert_service_envflag_enabled | bool
