---
- name: Setup runtime service parameters
  ansible.builtin.set_fact:
    _runtime_vminsert_service_args: "{{ vminsert_service_args | default({}, true) }}"
    _runtime_vminsert_service_envflag_data: "{{ vminsert_service_envflag_data | default({}, true) }}"

- name: Assert envflag data is unset when envflag support is disabled
  ansible.builtin.assert:
    that: _runtime_vminsert_service_envflag_data | length == 0
    msg: >-
      vminsert_service_envflag_enabled is disabled, so vminsert_service_envflag_data
      is not passed to vminsert. Move these parameters to vminsert_service_args or
      enable envflag support.
  when: not vminsert_service_envflag_enabled | bool

- name: Validate envflag data
  vars:
    envflag_key_pattern: '^[A-Za-z_][A-Za-z0-9_]*\Z'
    envflag_value_pattern: '^[^''\n]*\Z'
    envflag_invalid_keys: >-
      {{ _runtime_vminsert_service_envflag_data.keys() | map('string')
         | reject('match', envflag_key_pattern) | join(', ') }}
    envflag_invalid_value_keys: >-
      {{ _runtime_vminsert_service_envflag_data.keys()
         | zip(_runtime_vminsert_service_envflag_data.values() | map('string'))
         | rejectattr('1', 'match', envflag_value_pattern)
         | map(attribute='0') | join(', ') }}
  ansible.builtin.assert:
    that:
    - _runtime_vminsert_service_envflag_data.keys() | map('string') | reject('match', envflag_key_pattern) | list | length == 0
    - _runtime_vminsert_service_envflag_data.values() | map('string') | reject('match', envflag_value_pattern) | list | length == 0
    fail_msg: >-
      vminsert_service_envflag_data keys must match [A-Za-z_][A-Za-z0-9_]* and values must be
      single-line and contain no single quote. Each '.' in a flag name must be replaced
      with '_'. The role renders every entry into vminsert_service_envflag_data_file as
      KEY='value', and systemd recognizes no escape sequences inside single quotes, so a
      single quote in a value terminates it early. systemd also drops an EnvironmentFile
      assignment whose name it rejects, logging "Ignoring invalid environment assignment"
      and starting the service anyway, so an invalid key is never applied. Values are not
      reported because they can hold secrets.
      Invalid keys: [{{ envflag_invalid_keys }}].
      Keys with invalid values: [{{ envflag_invalid_value_keys }}].
  when: vminsert_service_envflag_enabled | bool

- name: Pass relabel config via service args when envflag support is disabled
  ansible.builtin.set_fact:
    _runtime_vminsert_service_args: "{{ _runtime_vminsert_service_args | combine({'relabelConfig': vminsert_config_dir ~ '/relabel.yaml'}) }}"
  when: not vminsert_service_envflag_enabled | bool and vminsert_relabel_config != ""

- name: Assert usage of systemd as an init system
  ansible.builtin.assert:
    that: ansible_facts['service_mgr'] == 'systemd'
    msg: "This role only works with systemd"

- name: Get systemd version
  ansible.builtin.command: systemctl --version
  changed_when: false
  check_mode: false
  register: __systemd_version

- name: Set systemd version fact
  ansible.builtin.set_fact:
    vminsert_systemd_version: "{{ __systemd_version.stdout_lines[0].split(' ')[1] }}"

- name: Check if vminsert is installed
  ansible.builtin.stat:
    path: "{{ vminsert_bin_dir }}/vminsert-prod"
  changed_when: false
  check_mode: false
  register: vminsert_is_installed

- name: Check current vminsert version
  ansible.builtin.command:
    argv:
    - "{{ vminsert_bin_dir }}/vminsert-prod"
    - --version
  changed_when: false
  failed_when: false
  check_mode: false
  register: vminsert_current_version
  when: vminsert_is_installed.stat.exists | bool

- name: Get latest VMinsert version via GitHub redirect
  ansible.builtin.uri:
    url: "{{ vminsert_repo_url }}/releases/latest"
    method: HEAD
    return_content: false
    follow_redirects: false
    status_code: 302,200
  register: gh_redirect
  when: vminsert_version == "latest"

- name: Extract version from Location header
  ansible.builtin.set_fact:
    vminsert_version: "{{ (gh_redirect.location | regex_search('/releases/tag/(v[0-9].*)', '\\1'))[0] }}"
  when: vminsert_version == "latest"
