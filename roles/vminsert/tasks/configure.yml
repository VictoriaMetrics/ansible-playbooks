---
# Validated here rather than in preinstall.yml because preinstall_license.yml
# appends the license entries to _runtime_vminsert_service_envflag_data after
# preinstall.yml has already run.
- name: Validate envflag data
  vars:
    envflag_key_pattern: '^[A-Za-z_][A-Za-z0-9_]*\Z'
    envflag_value_pattern: '^[^''\n]*\Z'
    envflag_invalid_keys: >-
      {{ _runtime_vminsert_service_envflag_data.keys() | map('string')
         | reject('match', envflag_key_pattern) | join(', ') }}
    envflag_invalid_value_keys: >-
      {{ _runtime_vminsert_service_envflag_data.keys()
         | zip(_runtime_vminsert_service_envflag_data.values() | map('string'))
         | rejectattr('1', 'match', envflag_value_pattern)
         | map(attribute='0') | join(', ') }}
  ansible.builtin.assert:
    that:
      - _runtime_vminsert_service_envflag_data.keys() | map('string') | reject('match', envflag_key_pattern) | list | length == 0
      - _runtime_vminsert_service_envflag_data.values() | map('string') | reject('match', envflag_value_pattern) | list | length == 0
    fail_msg: >-
      vminsert_service_envflag_data keys must match [A-Za-z_][A-Za-z0-9_]* and values must be
      single-line and contain no single quote. Each '.' in a flag name must be replaced
      with '_'. Entries are rendered into vminsert_service_envflag_data_file as KEY='value',
      and a single quote in a value terminates it early. Values are not reported because
      they can hold secrets. This also covers vminsert_license_key and
      vminsert_license_key_file, which are appended as license and licenseFile.
      Invalid keys: [{{ envflag_invalid_keys }}].
      Keys with invalid values: [{{ envflag_invalid_value_keys }}].
  when: vminsert_service_envflag_enabled | bool

- name: Validate envflag file paths
  ansible.builtin.assert:
    that:
      - vminsert_service_envflag_data_file != vminsert_service_envflag_file
    fail_msg: >-
      vminsert_service_envflag_data_file and vminsert_service_envflag_file must be
      different paths, but both resolve to {{ vminsert_service_envflag_data_file }}.
      The role rewrites vminsert_service_envflag_data_file on every run, so a shared
      path discards whatever you keep in vminsert_service_envflag_file - including
      secrets - and collapses the override the two-file layout provides.
  when: vminsert_service_envflag_enabled | bool

- name: "Systemd | Copy vminsert systemd unit file"
  ansible.builtin.template:
    src: vminsert.service.j2
    dest: "/etc/systemd/system/{{ vminsert_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: Restart vminsert service

- name: "Systemd | ensure vminsert service is enabled" # noqa: no-handler
  become: true
  ansible.builtin.systemd:
    name: "{{ vminsert_service_name }}"
    enabled: true

- name: Prepare configuration dir
  ansible.builtin.file:
    state: directory
    path: "{{ vminsert_config_dir }}"
    mode: "0751"
    owner: "{{ vminsert_system_user }}"
    group: "{{ vminsert_system_group }}"

- name: Template relabel config
  ansible.builtin.template:
    src: relabeling.yaml.j2
    dest: "{{ vminsert_config_dir }}/relabel.yaml"
    owner: "{{ vminsert_system_user }}"
    group: "{{ vminsert_system_group }}"
    mode: "0600"
  when:
    - vminsert_relabel_config != ""
  notify: Restart vminsert service

- name: Configure envflag data file
  ansible.builtin.template:
    dest: "{{ vminsert_service_envflag_data_file }}"
    src: "vminsert.conf.j2"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: vminsert_service_envflag_enabled | bool
  notify: Restart vminsert service

- name: Setup envfile
  ansible.builtin.file:
    state: touch
    path: "{{ vminsert_service_envflag_file }}"
    owner: root
    group: root
    mode: "0600"
    access_time: preserve
    modification_time: preserve
  when: vminsert_service_envflag_enabled | bool
  notify: Restart vminsert service
