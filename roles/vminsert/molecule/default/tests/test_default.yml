service:
  "vminsert":
    enabled: true
    running: true

port:
  tcp:8480:
    listening: true

file:
  /etc/systemd/system/vminsert.service:
    exists: true
    contains:
      - "--insert.maxQueueDuration=1m"
      - "ProtectControlGroups=true"
      - "ProtectKernelModules=true"
      - "ProtectKernelTunables=yes"
