---
- name: Prepare
  hosts: all
  become: true
  tasks:
    - name: Create scrape config dir
      ansible.builtin.file:
        state: directory
        path: /opt/vic-vmagent/configs
        mode: "0750"

    - name: Create stale scrape config file
      ansible.builtin.copy:
        content: |
          - job_name: stale
            static_configs:
              - targets: ["127.0.0.1:9100"]
        dest: /opt/vic-vmagent/configs/stale.yml
        mode: "0644"
