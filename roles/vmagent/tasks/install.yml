---
- name: Create VMagent system group
  ansible.builtin.group:
    name: "{{ vmagent_system_group }}"
    state: present
    system: true
  when: vmagent_system_group != "root"

- name: Create VMagent system user
  ansible.builtin.user:
    name: "{{ vmagent_system_user }}"
    groups: "{{ vmagent_system_group }}"
    append: true
    shell: /usr/sbin/nologin
    system: true
    createhome: false
  when: vmagent_system_user != "root"

- name: Ensure existence of bin directory
  ansible.builtin.file:
    path: "{{ vmagent_bin_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install via control host
  when: vmagent_install_download_to_control
  block:
  - name: Download and unarchive VMagent release binary
    environment:
      http_proxy: "{{ vm_proxy_http }}"
      https_proxy: "{{ vm_proxy_https }}"
    ansible.builtin.unarchive:
      src: "{{ vmagent_download_url }}"
      dest: /tmp
      remote_src: yes
    delegate_to: localhost
    become: no
    when:
    - not ansible_check_mode
    - not vmagent_is_installed.stat.exists or
      vmagent_version not in vmagent_current_version.stdout

  - name: Copy vmagent binary to target host
    notify: Restart VMagent service
    ansible.builtin.copy:
      src: /tmp/vmagent-prod
      dest: "{{ vmagent_bin_dir }}/vmagent-prod"
      mode: "0751"
      owner: root
      group: "{{ vmagent_system_group }}"
    when:
    - not ansible_check_mode
    - not vmagent_is_installed.stat.exists or
      vmagent_version not in vmagent_current_version.stdout

  always:
  - name: Clear download file
    delegate_to: localhost
    become: no
    ansible.builtin.file:
      path: /tmp/vmagent-prod
      state: absent
    when:
    - not ansible_check_mode

- name: Install directly to target host
  when: not vmagent_install_download_to_control
  block:
  - name: Download and unarchive VMagent release binary
    environment:
      http_proxy: "{{ vm_proxy_http }}"
      https_proxy: "{{ vm_proxy_https }}"
    ansible.builtin.unarchive:
      src: "{{ vmagent_download_url }}"
      dest: /tmp
      remote_src: yes
      extra_opts:
      - --no-same-owner
    when:
    - not ansible_check_mode
    - not vmagent_is_installed.stat.exists or
      vmagent_version not in vmagent_current_version.stdout

  - name: Replace vmagent binary at target dir # noqa: no-changed-when
    notify: Restart VMagent service
    ansible.builtin.copy:
      src: /tmp/vmagent-prod
      dest: "{{ vmagent_bin_dir }}/vmagent-prod"
      mode: "0751"
      owner: root
      group: "{{ vmagent_system_group }}"
      remote_src: true
    when:
    - not ansible_check_mode
    - not vmagent_is_installed.stat.exists or
      vmagent_version not in vmagent_current_version.stdout

  always:
  - name: Clear download file
    ansible.builtin.file:
      path: /tmp/vmagent-prod
      state: absent
    when:
    - not ansible_check_mode

- name: Restore SELinux context for vmagent binary
  ansible.builtin.command:
    argv:
    - restorecon
    - -v
    - "{{ vmagent_bin_dir }}/vmagent-prod"
  register: restorecon_result
  changed_when: "'relabeled' in restorecon_result.stdout"
  when:
  - ansible_facts['selinux'] is defined
  - ansible_facts['selinux'].status == "enabled"
  - not ansible_check_mode
