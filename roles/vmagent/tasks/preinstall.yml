---
- name: Assert usage of systemd as an init system
  ansible.builtin.assert:
    that: ansible_facts['service_mgr'] == 'systemd'
    msg: "This role only works with systemd"

- name: Get systemd version
  ansible.builtin.command: systemctl --version
  changed_when: false
  check_mode: false
  register: __systemd_version

- name: Set systemd version fact
  ansible.builtin.set_fact:
    vmagent_systemd_version: "{{ __systemd_version.stdout_lines[0].split(' ')[1] }}"

- name: Check if VMagent is installed
  ansible.builtin.stat:
    path: "{{ vmagent_bin_dir }}/vmagent-prod"
  changed_when: false
  check_mode: false
  register: vmagent_is_installed

- name: Check current VMagent version
  ansible.builtin.command:
    argv:
    - "{{ vmagent_bin_dir }}/vmagent-prod"
    - --version
  changed_when: false
  failed_when: false
  check_mode: false
  register: vmagent_current_version
  when: vmagent_is_installed.stat.exists | bool

- name: Get latest VMagent version via GitHub redirect
  ansible.builtin.uri:
    url: "{{ vmagent_repo_url }}/releases/latest"
    method: HEAD
    return_content: false
    follow_redirects: false
    status_code: 302,200
  register: gh_redirect
  when: vmagent_version == "latest"

- name: Extract version from Location header
  ansible.builtin.set_fact:
    vmagent_version: "{{ (gh_redirect.location | regex_search('/releases/tag/(v[0-9].*)', '\\1'))[0] }}"
  when: vmagent_version == "latest"

# --version reports e.g. "tags-v1.154.0-enterprise-0-g<sha>", so the version
# substring alone does not detect an OSS <-> enterprise switch.
- name: Check if vmagent binary needs to be installed
  ansible.builtin.set_fact:
    vmagent_needs_install: >-
      {{ not vmagent_is_installed.stat.exists
         or vmagent_version not in vmagent_current_version.stdout
         or (vmagent_enterprise | bool) != ('-enterprise' in vmagent_current_version.stdout) }}
