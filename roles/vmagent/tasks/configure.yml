---
- name: Configure env
  when: vmagent_service_envflag_enabled | bool
  block:
    - name: Validate envflag data
      vars:
        envflag_entry_pattern: '^[A-Za-z_][A-Za-z0-9_]*=[^''\n]*\Z'
        envflag_invalid_positions: >-
          {{ vmagent_service_envflag_data | map('string')
             | zip(range(1, vmagent_service_envflag_data | length + 1))
             | rejectattr('0', 'match', envflag_entry_pattern)
             | map(attribute='1') | join(', ') }}
      ansible.builtin.assert:
        that:
          - vmagent_service_envflag_data | map('string') | reject('match', envflag_entry_pattern) | list | length == 0
        fail_msg: >-
          vmagent_service_envflag_data entries must be single-line KEY=value strings whose
          key matches [A-Za-z_][A-Za-z0-9_]* and whose value contains no single quote.
          Each '.' in a flag name must be replaced with '_'. The role renders every entry
          into vmagent_service_envflag_data_file as KEY='value', and systemd recognizes no
          escape sequences inside single quotes, so a single quote in a value terminates it
          early. systemd also drops an assignment whose name it rejects, logging "Ignoring
          invalid environment assignment" and starting the service anyway, so an invalid key
          would never be applied. Entry values are not reported because they can hold
          secrets - invalid entries are at 1-based positions: {{ envflag_invalid_positions }}

    - name: Validate envflag file paths
      ansible.builtin.assert:
        that:
          - vmagent_service_envflag_data_file != vmagent_service_envflag_file
        fail_msg: >-
          vmagent_service_envflag_data_file and vmagent_service_envflag_file must be
          different paths, but both resolve to {{ vmagent_service_envflag_data_file }}.
          The role rewrites vmagent_service_envflag_data_file on every run, so a shared
          path discards whatever you keep in vmagent_service_envflag_file - including
          secrets - and collapses the override the two-file layout provides.

    - name: Configure envflag data file
      ansible.builtin.template:
        src: envflag.env.j2
        dest: "{{ vmagent_service_envflag_data_file }}"
        owner: root
        group: root
        mode: "0600"
      no_log: true
      notify: Restart VMagent service

    - name: Setup envfile
      ansible.builtin.file:
        state: touch
        path: "{{ vmagent_service_envflag_file }}"
        owner: root
        group: root
        mode: "0600"
        access_time: preserve
        modification_time: preserve
      notify: Restart VMagent service

- name: Copy VMagent systemd unit file
  ansible.builtin.template:
    src: vmagent.service.j2
    dest: "/etc/systemd/system/{{ vmagent_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  register: config_template
  no_log: True
  notify: Restart VMagent service

- name: Daemon-reload VMagent service # noqa: no-handler
  become: true
  ansible.builtin.systemd:
    daemon_reload: true
  when: config_template is changed
  changed_when: config_template is changed

- name: Ensure VMagent service is enabled on boot
  become: true
  ansible.builtin.systemd:
    name: "{{ vmagent_service_name }}"
    enabled: true

- name: Prepare configuration dir
  ansible.builtin.file:
    state: directory
    path: "{{ vmagent_config_dir }}"
    mode: "0751"
    owner: "{{ vmagent_system_user }}"
    group: "{{ vmagent_system_group }}"

- name: Prepare sd configuration dir
  ansible.builtin.file:
    state: directory
    path: "{{ vmagent_sd_config_dir }}"
    mode: "0777"
    owner: "{{ vmagent_system_user }}"
    group: "{{ vmagent_system_group }}"

- name: Configure promscrape config
  ansible.builtin.template:
    src: prometheus_scrape.yml.j2
    dest: "{{ vmagent_config_dir }}/config.yml"
    mode: "0751"
    owner: "{{ vmagent_system_user }}"
    group: "{{ vmagent_system_group }}"
    validate: "{{ vmagent_bin_dir }}/vmagent-prod {% for k, v in vmagent_service_args.items() %}{% if k.startswith('license') %} -{{ k }}={{ v | quote }} {% endif %}{% endfor %} -promscrape.config %s -dryRun"
  no_log: true
  notify: Restart VMagent service

- name: Configure stream aggregation config
  ansible.builtin.template:
    src: stream_aggregation.yml.j2
    dest: "{{ vmagent_config_dir }}/aggregation.yml"
    mode: "0751"
    owner: "{{ vmagent_system_user }}"
    group: "{{ vmagent_system_group }}"
    validate: "{{ vmagent_bin_dir }}/vmagent-prod {% for k, v in vmagent_service_args.items() %}{% if k.startswith('license') %} -{{ k }}={{ v | quote }} {% endif %}{% endfor %} -streamAggr.config %s -dryRun"
  no_log: true
  notify: Restart VMagent service

- name: Prepare tmp data dir
  ansible.builtin.file:
    state: directory
    path: "{{ vmagent_tmp_data_path }}"
    mode: "0751"
    owner: "{{ vmagent_system_user }}"
    group: "{{ vmagent_system_group }}"
