---
- name: Configure env
  when: vmagent_service_envflag_enabled | bool
  block:
    - name: Validate envflag data
      vars:
        envflag_entry_pattern: '^[A-Za-z_][A-Za-z0-9_]*=[^"\n]*\Z'
        envflag_invalid_entries: "{{ vmagent_service_envflag_data | map('string') | reject('match', envflag_entry_pattern) | list }}"
      ansible.builtin.assert:
        that:
          - envflag_invalid_entries | length == 0
        fail_msg: >-
          vmagent_service_envflag_data entries must be single-line KEY=value strings
          containing no double quote. A newline in an entry closes the Environment=
          line and injects the rest as systemd directives, which can override User=.
          Invalid entries: {{ envflag_invalid_entries }}

    - name: Check envfile presence
      ansible.builtin.stat:
        path: "{{ vmagent_service_envflag_file }}"
      register: envfile_state

    - name: Setup envfile
      ansible.builtin.file:
        state: touch
        path: "{{ vmagent_service_envflag_file }}"
        owner: root
        group: root
        mode: "0644"
        access_time: preserve
      notify: Restart VMagent service
      when: envfile_state.stat.exists is defined and not envfile_state.stat.exists

- name: Copy VMagent systemd unit file
  ansible.builtin.template:
    src: vmagent.service.j2
    dest: "/etc/systemd/system/{{ vmagent_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  register: config_template
  no_log: True
  notify: Restart VMagent service

- name: Daemon-reload VMagent service # noqa: no-handler
  become: true
  ansible.builtin.systemd:
    daemon_reload: true
  when: config_template is changed
  changed_when: config_template is changed

- name: Ensure VMagent service is enabled on boot
  become: true
  ansible.builtin.systemd:
    name: "{{ vmagent_service_name }}"
    enabled: true

- name: Prepare configuration dir
  ansible.builtin.file:
    state: directory
    path: "{{ vmagent_config_dir }}"
    mode: "0751"
    owner: "{{ vmagent_system_user }}"
    group: "{{ vmagent_system_group }}"

- name: Prepare sd configuration dir
  ansible.builtin.file:
    state: directory
    path: "{{ vmagent_sd_config_dir }}"
    mode: "0777"
    owner: "{{ vmagent_system_user }}"
    group: "{{ vmagent_system_group }}"

- name: Configure promscrape config
  ansible.builtin.template:
    src: prometheus_scrape.yml.j2
    dest: "{{ vmagent_config_dir }}/config.yml"
    mode: "0751"
    owner: "{{ vmagent_system_user }}"
    group: "{{ vmagent_system_group }}"
    validate: "{{ vmagent_bin_dir }}/vmagent-prod {% for k, v in vmagent_service_args.items() %}{% if k.startswith('license') %} -{{ k }}={{ v | quote }} {% endif %}{% endfor %} -promscrape.config %s -dryRun"
  no_log: true
  notify: Restart VMagent service

- name: Configure stream aggregation config
  ansible.builtin.template:
    src: stream_aggregation.yml.j2
    dest: "{{ vmagent_config_dir }}/aggregation.yml"
    mode: "0751"
    owner: "{{ vmagent_system_user }}"
    group: "{{ vmagent_system_group }}"
    validate: "{{ vmagent_bin_dir }}/vmagent-prod {% for k, v in vmagent_service_args.items() %}{% if k.startswith('license') %} -{{ k }}={{ v | quote }} {% endif %}{% endfor %} -streamAggr.config %s -dryRun"
  no_log: true
  notify: Restart VMagent service

- name: Prepare tmp data dir
  ansible.builtin.file:
    state: directory
    path: "{{ vmagent_tmp_data_path }}"
    mode: "0751"
    owner: "{{ vmagent_system_user }}"
    group: "{{ vmagent_system_group }}"
