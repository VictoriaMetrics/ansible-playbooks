# Enterprise flags go to _vmauth_enterprise_args, which the templates merge into
# vmauth_service_args. set_fact on vmauth_service_args itself would be shadowed when users
# pass it as include_role vars or extra vars.
- name: Check whether the release accepts -eula instead of a license key
  ansible.builtin.set_fact:
    _vmauth_enterprise_args: {}
    _vmauth_use_eula: >-
      {{ (vmauth_enterprise | bool) and (_version == 'latest'
        or _version is version('1.156.0', '>=')
        or (_version is version('1.148.9', '>=') and _version is version('1.149.0', '<'))
        or (_version is version('1.136.23', '>=') and _version is version('1.137.0', '<'))) }}
  vars:
    # -eula replaced license keys in v1.156.0 and LTS releases v1.148.9 and v1.136.23:
    # https://docs.victoriametrics.com/victoriametrics/changelog/#v11560
    # "latest" is resolved to a tag later in preinstall.yml; the latest release
    # already uses -eula, so it is not compared here.
    _version: "{{ vmauth_version | regex_replace('^v', '') }}"

- name: Accept the Enterprise EULA
  when:
    - vmauth_enterprise | bool
    - _vmauth_use_eula | bool
  block:
    - name: Ensure the Enterprise Software Agreement is accepted
      ansible.builtin.assert:
        that: vmauth_accept_eula | bool
        msg: >-
          vmauth {{ vmauth_version }} Enterprise runs only with the Enterprise Software Agreement
          (https://victoriametrics.com/legal/esa/) accepted. Set vmauth_accept_eula (or vm_enterprise_accept_eula for all roles)
          to true to accept it.

    - name: Add eula parameter to service config
      ansible.builtin.set_fact:
        _vmauth_enterprise_args:
          eula: "true"

    - name: Report ignored license variables
      ansible.builtin.debug:
        msg: >-
          vmauth {{ vmauth_version }} does not verify license keys and runs with -eula,
          so vmauth_license_key and vmauth_license_key_file are ignored.
      when: vmauth_license_key != "" or vmauth_license_key_file != ""

- name: Pass the license key
  when:
    - vmauth_enterprise | bool
    - not (_vmauth_use_eula | bool)
  block:
    - name: Ensure license key is provided
      ansible.builtin.assert:
        that: vmauth_license_key != "" or vmauth_license_key_file != ""
        msg: Either license key or license key file location must be provided.

    - name: Ensure only one of key or file is provided
      ansible.builtin.assert:
        that: vmauth_license_key == "" or vmauth_license_key_file == ""
        msg: Only one of license key or license key file must be provided.

    - name: Add license key parameter to service config
      ansible.builtin.set_fact:
        _vmauth_enterprise_args:
          license: "{{ vmauth_license_key }}"
      when: vmauth_license_key != ""
      no_log: "{{ vmauth_ansible_no_log }}"

    - name: Add license key file parameter to service config
      ansible.builtin.set_fact:
        _vmauth_enterprise_args:
          licenseFile: "{{ vmauth_license_key_file }}"
      when: vmauth_license_key_file != ""
      no_log: "{{ vmauth_ansible_no_log }}"
