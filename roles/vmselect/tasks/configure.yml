---
# Validated here rather than in preinstall.yml because preinstall_license.yml
# appends the license entries to _runtime_vmselect_service_envflag_data after
# preinstall.yml has already run.
- name: Validate envflag data
  vars:
    envflag_key_pattern: '^[A-Za-z_][A-Za-z0-9_]*\Z'
    envflag_value_pattern: '^[^''\n]*\Z'
    envflag_invalid_keys: >-
      {{ _runtime_vmselect_service_envflag_data.keys() | map('string')
         | reject('match', envflag_key_pattern) | join(', ') }}
    envflag_invalid_value_keys: >-
      {{ _runtime_vmselect_service_envflag_data.keys()
         | zip(_runtime_vmselect_service_envflag_data.values() | map('string'))
         | rejectattr('1', 'match', envflag_value_pattern)
         | map(attribute='0') | join(', ') }}
  ansible.builtin.assert:
    that:
      - _runtime_vmselect_service_envflag_data.keys() | map('string') | reject('match', envflag_key_pattern) | list | length == 0
      - _runtime_vmselect_service_envflag_data.values() | map('string') | reject('match', envflag_value_pattern) | list | length == 0
    fail_msg: >-
      vmselect_service_envflag_data keys must match [A-Za-z_][A-Za-z0-9_]* and values must be
      single-line and contain no single quote. Each '.' in a flag name must be replaced
      with '_'. Entries are rendered into vmselect_service_envflag_data_file as KEY='value',
      and a single quote in a value terminates it early. Values are not reported because
      they can hold secrets. This also covers vmselect_license_key and
      vmselect_license_key_file, which are appended as license and licenseFile.
      Invalid keys: [{{ envflag_invalid_keys }}].
      Keys with invalid values: [{{ envflag_invalid_value_keys }}].
  when: vmselect_service_envflag_enabled | bool

- name: Validate envflag file paths
  ansible.builtin.assert:
    that:
      - vmselect_service_envflag_data_file != vmselect_service_envflag_file
    fail_msg: >-
      vmselect_service_envflag_data_file and vmselect_service_envflag_file must be
      different paths, but both resolve to {{ vmselect_service_envflag_data_file }}.
      The role rewrites vmselect_service_envflag_data_file on every run, so a shared
      path discards whatever you keep in vmselect_service_envflag_file - including
      secrets - and collapses the override the two-file layout provides.
  when: vmselect_service_envflag_enabled | bool

- name: "Systemd | Copy vmselect systemd unit file"
  ansible.builtin.template:
    src: vmselect.service.j2
    dest: "/etc/systemd/system/{{ vmselect_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: Restart vmselect service

- name: "Systemd | ensure vmselect service is enabled" # noqa: no-handler
  become: true
  ansible.builtin.systemd:
    name: "{{ vmselect_service_name }}"
    enabled: true

- name: Prepare configuration dir
  ansible.builtin.file:
    state: directory
    path: "{{ vmselect_config_dir }}"
    mode: "0751"
    owner: "{{ vmselect_system_user }}"
    group: "{{ vmselect_system_group }}"

- name: Configure envflag data file
  ansible.builtin.template:
    dest: "{{ vmselect_service_envflag_data_file }}"
    src: "vmselect.conf.j2"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: vmselect_service_envflag_enabled | bool
  notify: Restart vmselect service

- name: Setup envfile
  ansible.builtin.file:
    state: touch
    path: "{{ vmselect_service_envflag_file }}"
    owner: root
    group: root
    mode: "0600"
    access_time: preserve
    modification_time: preserve
  when: vmselect_service_envflag_enabled | bool
  notify: Restart vmselect service

- name: Prepare cache dir
  ansible.builtin.file:
    state: directory
    path: "{{ vmselect_cache_dir }}"
    mode: "0751"
    owner: "{{ vmselect_system_user }}"
    group: "{{ vmselect_system_group }}"
