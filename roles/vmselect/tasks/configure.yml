---
- name: "Systemd | Copy vmselect systemd unit file"
  ansible.builtin.template:
    src: vmselect.service.j2
    dest: "/etc/systemd/system/{{ vmselect_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: Restart vmselect service

- name: "Systemd | ensure vmselect service is enabled" # noqa: no-handler
  become: true
  ansible.builtin.systemd:
    name: "{{ vmselect_service_name }}"
    enabled: true

- name: Prepare configuration dir
  ansible.builtin.file:
    state: directory
    path: "{{ vmselect_config_dir }}"
    mode: "0751"
    owner: "{{ vmselect_system_user }}"
    group: "{{ vmselect_system_group }}"

- name: Configure envflag data file
  ansible.builtin.template:
    dest: "{{ vmselect_service_envflag_data_file }}"
    src: "vmselect.conf.j2"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: vmselect_service_envflag_enabled | bool
  notify: Restart vmselect service

- name: Setup envfile
  ansible.builtin.file:
    state: touch
    path: "{{ vmselect_service_envflag_file }}"
    owner: root
    group: root
    mode: "0600"
    access_time: preserve
    modification_time: preserve
  when: vmselect_service_envflag_enabled | bool
  notify: Restart vmselect service

- name: Prepare cache dir
  ansible.builtin.file:
    state: directory
    path: "{{ vmselect_cache_dir }}"
    mode: "0751"
    owner: "{{ vmselect_system_user }}"
    group: "{{ vmselect_system_group }}"
