service:
  "vmselect":
    enabled: true
    running: true

port:
  tcp:8481:
    listening: true

file:
  /etc/systemd/system/vmselect.service:
    exists: true
    contains:
      - "--search.maxUniqueTimeseries=500000"
      - "ProtectControlGroups=true"
      - "ProtectKernelModules=true"
      - "ProtectKernelTunables=yes"
