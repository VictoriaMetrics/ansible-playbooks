service:
  "vmselect":
    enabled: true
    running: true

port:
  tcp:8481:
    listening: true

# envflag is off here, which makes this scenario the disabled-path regression
# guard: no envflag artefacts in the unit, every flag on ExecStart.
file:
  /etc/systemd/system/vmselect.service:
    exists: true
    contains:
      - "/^ExecStart=\\S*vmselect-prod --/"
      - "!/-envflag\\.enable/"
      - "!/^EnvironmentFile=/"
      - "--storageNode=vmstorage1"
