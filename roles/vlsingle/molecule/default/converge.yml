---
- name: Converge
  hosts: all
  become: yes
  vars:
    vlsingle_data_dir: "/tmp/victoria-logs/"
    # Envflag enabled here so the Configure env block in tasks/configure.yml
    # executes somewhere in CI. -http.pathPrefix is only ever supplied through
    # the env file, so the http check in test_default.yml proves it took effect.
    vlsingle_service_envflag_enabled: true
    vlsingle_service_envflag_data:
      - "http_pathPrefix=/vlsingle"
    # Deprecated alias set on purpose to prove backward-compatible resolution.
    victorialogs_retention_period_months: "6"
  tasks:
    - name: "Include vlsingle"
      ansible.builtin.include_role:
        name: "vlsingle"
        public: true

    - name: "Assert deprecated alias resolves into service args"
      ansible.builtin.assert:
        that:
          - vlsingle_service_args['retentionPeriod'] == '6'
        fail_msg: >-
          Deprecated alias victorialogs_retention_period_months did not resolve
          into vlsingle_service_args
