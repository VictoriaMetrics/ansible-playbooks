---
- name: Assert usage of systemd as an init system
  ansible.builtin.assert:
    that: ansible_facts['service_mgr'] == 'systemd'
    msg: "This role only works with systemd"

- name: Get systemd version
  ansible.builtin.command: systemctl --version
  changed_when: false
  check_mode: false
  register: __systemd_version

- name: Set systemd version fact
  ansible.builtin.set_fact:
    vlsingle_systemd_version: "{{ __systemd_version.stdout_lines[0].split(' ')[1] }}"

- name: Check if VictoriaLogs is installed
  ansible.builtin.stat:
    path: "{{ vlsingle_bin_dir }}/victoria-logs-prod"
  changed_when: false
  check_mode: false
  register: vlsingle_is_installed

- name: Check current VictoriaLogs version
  ansible.builtin.command:
    argv:
    - "{{ vlsingle_bin_dir }}/victoria-logs-prod"
    - --version
  changed_when: false
  failed_when: false
  check_mode: false
  register: vlsingle_current_version
  when: vlsingle_is_installed.stat.exists | bool

- name: Get latest VictoriaLogs version via GitHub redirect
  ansible.builtin.uri:
    url: "{{ vlsingle_repo_url }}/releases/latest"
    method: HEAD
    return_content: false
    follow_redirects: false
    status_code: 302,200
  register: gh_redirect
  when: vlsingle_version == "latest"

- name: Extract version from Location header
  ansible.builtin.set_fact:
    vlsingle_version: "{{ (gh_redirect.location | regex_search('/releases/tag/(v[0-9].*)', '\\1'))[0] }}"
  when: vlsingle_version == "latest"

# --version reports e.g. "tags-v1.154.0-enterprise-0-g<sha>", so the version
# substring alone does not detect an OSS <-> enterprise switch.
- name: Check if vlsingle binary needs to be installed
  ansible.builtin.set_fact:
    vlsingle_needs_install: >-
      {{ not vlsingle_is_installed.stat.exists
         or vlsingle_version not in vlsingle_current_version.stdout
         or (vlsingle_enterprise | bool) != ('-enterprise' in vlsingle_current_version.stdout) }}
