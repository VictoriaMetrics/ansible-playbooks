---
- name: Configure env
  when: vmsingle_service_envflag_enabled | bool
  block:
    - name: Validate envflag data
      vars:
        envflag_entry_pattern: '^[A-Za-z_][A-Za-z0-9_]*=[^''\n]*\Z'
        envflag_invalid_positions: >-
          {{ vmsingle_service_envflag_data | map('string')
             | zip(range(1, vmsingle_service_envflag_data | length + 1))
             | rejectattr('0', 'match', envflag_entry_pattern)
             | map(attribute='1') | join(', ') }}
      ansible.builtin.assert:
        that:
          - vmsingle_service_envflag_data | map('string') | reject('match', envflag_entry_pattern) | list | length == 0
        fail_msg: >-
          vmsingle_service_envflag_data entries must be single-line KEY=value strings whose
          key matches [A-Za-z_][A-Za-z0-9_]* and whose value contains no single quote.
          Each '.' in a flag name must be replaced with '_'. The role renders every entry
          into vmsingle_service_envflag_data_file as KEY='value', and systemd recognizes no
          escape sequences inside single quotes, so a single quote in a value terminates it
          early. systemd also drops an assignment whose name it rejects, logging "Ignoring
          invalid environment assignment" and starting the service anyway, so an invalid key
          would never be applied. Entry values are not reported because they can hold
          secrets - invalid entries are at 1-based positions: {{ envflag_invalid_positions }}

    - name: Validate envflag file paths
      ansible.builtin.assert:
        that:
          - vmsingle_service_envflag_data_file != vmsingle_service_envflag_file
        fail_msg: >-
          vmsingle_service_envflag_data_file and vmsingle_service_envflag_file must be
          different paths, but both resolve to {{ vmsingle_service_envflag_data_file }}.
          The role rewrites vmsingle_service_envflag_data_file on every run, so a shared
          path discards whatever you keep in vmsingle_service_envflag_file - including
          secrets - and collapses the override the two-file layout provides.

    - name: Configure envflag data file
      ansible.builtin.template:
        src: envflag.env.j2
        dest: "{{ vmsingle_service_envflag_data_file }}"
        owner: root
        group: root
        mode: "0600"
      no_log: true
      notify: Restart VictoriaMetrics service

    - name: Setup envfile
      ansible.builtin.file:
        state: touch
        path: "{{ vmsingle_service_envflag_file }}"
        owner: root
        group: root
        mode: "0600"
        access_time: preserve
        modification_time: preserve
      notify: Restart VictoriaMetrics service

- name: Copy VictoriaMetrics systemd unit file
  ansible.builtin.template:
    src: victoriametrics.service.j2
    dest: "/etc/systemd/system/{{ vmsingle_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  register: config_template
  no_log: True

- name: Daemon-reload VictoriaMetrics service
  become: true
  notify: Restart VictoriaMetrics service
  ansible.builtin.systemd:
    daemon_reload: true
    name: "{{ vmsingle_service_name }}"
  when: config_template is changed  # noqa: no-handler
  changed_when: config_template is changed

- name: Ensure VictoriaMetrics service is enabled on boot
  become: true
  ansible.builtin.systemd:
    name: "{{ vmsingle_service_name }}"
    enabled: true

- name: Configure credentials
  when:
    - vmsingle_backup_enabled | bool
    - crontab_which.rc == 0
  block:
    - name: Create aws credentials dir
      become: true
      ansible.builtin.file:
        path: ~/.aws
        state: directory
        mode: "0755"

    - name: Create aws config file
      become: true
      ansible.builtin.template:
        src: aws_config.j2
        dest: ~/.aws/config
        mode: "0600"

    - name: Template credentials file
      ansible.builtin.template:
        src: creds.j2
        dest: ~/.aws/credentials
        mode: "0600"

    - name: Set proxy config
      ansible.builtin.set_fact:
        _vmsingle_backup_proxy: "http_proxy={{ http_proxy }} https_proxy={{ http_proxy }} "
      when:
        - vmsingle_backup_proxy_enable
        - http_proxy is defined

    - name: Configure cron
      ansible.builtin.cron:
        name: "backup victoriametrics data"
        user: root
        state: present
        minute: "{{ vmsingle_backup_cron_minute }}"
        hour: "{{ vmsingle_backup_cron_hour }}"
        day: "{{ vmsingle_backup_cron_day }}"
        weekday: "{{ vmsingle_backup_cron_weekday }}"
        month: "{{ vmsingle_backup_cron_month }}"
        job: "{{ _vmsingle_backup_proxy | default('') }} {{ vmsingle_bin_dir }}/vmbackup-prod -snapshot.createURL=http://localhost:8428/snapshot/create {% if vmsingle_backup_custom_s3_endpoint != '' %} -customS3Endpoint {{ vmsingle_backup_custom_s3_endpoint }} {% endif %} -storageDataPath {{ vmsingle_data_dir }} -dst {{ vmsingle_backup_destination }}/$(date +\\%Y-\\%m-\\%d)"

- name: Delete cron if backup disabled
  ansible.builtin.cron:
    name: "backup victoriametrics data"
    user: root
    minute: "{{ vmsingle_backup_cron_minute }}"
    hour: "{{ vmsingle_backup_cron_hour }}"
    day: "{{ vmsingle_backup_cron_day }}"
    weekday: "{{ vmsingle_backup_cron_weekday }}"
    month: "{{ vmsingle_backup_cron_month }}"
    state: absent
  when:
    - not vmsingle_backup_enabled | bool
    - crontab_which.rc == 0
