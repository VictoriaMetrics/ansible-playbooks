---
- name: Assert usage of systemd as an init system
  ansible.builtin.assert:
    that: ansible_facts['service_mgr'] == 'systemd'
    msg: "This role only works with systemd"

- name: Get systemd version
  ansible.builtin.command: systemctl --version
  changed_when: false
  check_mode: false
  register: __systemd_version

- name: Set systemd version fact
  ansible.builtin.set_fact:
    vmsingle_systemd_version: "{{ __systemd_version.stdout_lines[0].split(' ')[1] }}"

- name: Check if VictoriaMetrics is installed
  ansible.builtin.stat:
    path: "{{ vmsingle_bin_dir }}/victoria-metrics-prod"
  changed_when: false
  check_mode: false
  register: vmsingle_is_installed

- name: Check current VictoriaMetrics version
  ansible.builtin.command:
    argv:
    - "{{ vmsingle_bin_dir }}/victoria-metrics-prod"
    - --version
  changed_when: false
  failed_when: false
  check_mode: false
  register: vmsingle_current_version
  when: vmsingle_is_installed.stat.exists | bool

- name: Check if crontab is present
  ansible.builtin.raw: which crontab
  check_mode: false
  changed_when: false
  failed_when: false
  register: crontab_which

- name: Get latest VictoriaMetrics version via GitHub redirect
  ansible.builtin.uri:
    url: "{{ vmsingle_repo_url }}/releases/latest"
    method: HEAD
    return_content: false
    follow_redirects: false
    status_code: 302,200
  register: gh_redirect
  when: vmsingle_version == "latest"

- name: Extract version from Location header
  ansible.builtin.set_fact:
    vmsingle_version: "{{ (gh_redirect.location | regex_search('/releases/tag/(v[0-9].*)', '\\1'))[0] }}"
  when: vmsingle_version == "latest"

# --version reports e.g. "tags-v1.154.0-enterprise-0-g<sha>", so the version
# substring alone does not detect an OSS <-> enterprise switch.
- name: Check if vmsingle binary needs to be installed
  ansible.builtin.set_fact:
    vmsingle_needs_install: >-
      {{ not vmsingle_is_installed.stat.exists
         or vmsingle_version not in vmsingle_current_version.stdout
         or (vmsingle_enterprise | bool) != ('-enterprise' in vmsingle_current_version.stdout) }}
