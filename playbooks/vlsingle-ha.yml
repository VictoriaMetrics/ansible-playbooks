---
# High-availability VictoriaLogs setup based on single-node instances.
# See https://docs.victoriametrics.com/victorialogs/#high-availability
# Deployment guide: https://github.com/VictoriaMetrics/ansible-playbooks/blob/master/docs/victorialogs-ha.md
#
#   - vlsingle: every instance stores a complete copy of the logs (port 9428)
#   - vlagent: accepts logs (port 9429), replicates them to every vlsingle
#     and buffers logs on disk for instances which are unavailable
#   - vmauth: single HTTP entrypoint (port 8427), routes inserts to vlagent
#     and selects to the first available vlsingle
#
# Send logs to and query logs from http://<any-vmauth-node>:8427/

- name: Setup vlsingle
  become: true
  hosts: vlsingle
  roles:
    - vlsingle

- name: Setup vlagent
  become: true
  hosts: vlagent
  vars:
    # The buffer must survive restarts, so keep it out of /tmp.
    vlagent_tmp_data_path: /var/lib/vlagent
    vlagent_service_args:
      remoteWrite.url: "{{ groups['vlsingle'] | map('regex_replace', '^(.+)$', 'http://\\1:9428/insert/multitenant/native') | list }}"
      remoteWrite.tmpDataPath: "{{ vlagent_tmp_data_path }}"
  roles:
    - vlagent

- name: Setup vmauth
  become: true
  hosts: vmauth
  vars:
    vmauth_auth_config: |-
      unauthorized_user:
        url_map:
          - src_paths:
              - "/insert/.+"
            url_prefix:
      {% for agent in groups['vlagent'] %}
              - "http://{{ agent }}:9429/"
      {% endfor %}
          - src_paths:
              - "/select/.+"
            url_prefix:
      {% for single in groups['vlsingle'] %}
              - "http://{{ single }}:9428/"
      {% endfor %}
            load_balancing_policy: first_available
  roles:
    - vmauth
