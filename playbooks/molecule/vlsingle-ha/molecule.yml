---
dependency:
  name: galaxy
  enabled: false
driver:
  name: docker

platforms:
  - &host
    name: vl-ha-single-1
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-debian13}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    networks:
      - name: vlsingle-ha
    groups:
      - vlsingle
  - <<: *host
    name: vl-ha-single-2
    groups:
      - vlsingle
  - <<: *host
    name: vl-ha-single-entry-1
    groups:
      - vlagent
      - vmauth
  - <<: *host
    name: vl-ha-single-entry-2
    groups:
      - vlagent
      - vmauth

provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "../../../roles"
    ANSIBLE_CONFIG: ../../../ansible.cfg
verifier:
  name: ansible
